<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分发成功动画 · 独立预览</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:#eef0f4;color:#1a1f36;font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}

:root{
  --primary:#1a3a5c;--primary-dark:#0f2540;--primary-light:#e8eef5;--primary-hover:#15355a;
  --accent:#bfa46f;--accent-light:#f5efe3;--accent-dark:#a08850;
  --success:#2d9d78;--success-light:#d8f0e6;
  --warning:#d4943a;--warning-light:#faf0db;
  --danger:#d4504e;--danger-light:#fae3e2;
  --purple:#7c5bba;--purple-light:#ece6f7;
  --cyan:#0a8db3;--cyan-light:#d3eef5;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e8eaed;--gray-300:#d6d9dd;
  --gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;
  --gray-800:#1f2937;--gray-900:#111827;
  --shadow-sm:0 1px 2px rgba(15,37,64,.04),0 1px 3px rgba(15,37,64,.06);
  --shadow-md:0 4px 12px rgba(15,37,64,.06),0 2px 4px rgba(15,37,64,.04);
  --shadow-lg:0 8px 24px rgba(15,37,64,.08),0 4px 8px rgba(15,37,64,.04);
  --shadow-xl:0 16px 40px rgba(15,37,64,.1),0 8px 16px rgba(15,37,64,.05);
  --radius:14px;--radius-sm:10px;
}

/* ===== 页面容器 ===== */
.demo-page{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:24px}
.demo-title{font-size:24px;font-weight:700;color:var(--gray-800)}
.demo-subtitle{font-size:14px;color:var(--gray-500);margin-top:-16px}

/* ===== 分发按钮 ===== */
.pub-distribute-btn{
  display:block;width:320px;padding:16px;
  background:linear-gradient(135deg,var(--primary) 0%,#0d2f4a 100%);
  color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;transition:all .25s;text-align:center;
  box-shadow:0 4px 14px rgba(26,58,92,.25);letter-spacing:.3px
}
.pub-distribute-btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(26,58,92,.35);background:linear-gradient(135deg,#1e4d72 0%,#0f3552 100%)}
.pub-distribute-btn:active{transform:translateY(0)}
.pub-distribute-btn .btn-rocket{font-size:18px;margin-right:6px}

/* ===== 侧边成功提示 ===== */
.pub-distribute-success{display:none;text-align:center;padding:12px 0 0;animation:pubSuccessPop .4s ease}
.pub-distribute-success.show{display:block}
.pub-distribute-success .su-icon{font-size:40px;display:block;margin-bottom:4px}
.pub-distribute-success .su-text{font-size:13px;font-weight:600;color:var(--success)}
@keyframes pubSuccessPop{0%{opacity:0;transform:scale(.5)}60%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}

/* ===== Toast 提示 ===== */
.pub-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:10003;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:pubToastIn .3s ease;display:none}
.pub-toast.show{display:block}
@keyframes pubToastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ========================================
   PUBLISH EFFECT OVERLAY · 分发动画核心
   ======================================== */
.pub-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(11,18,32,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:10001;display:none;align-items:center;justify-content:center;
  animation:pubOverlayIn .3s ease
}
.pub-overlay.show{display:flex}
@keyframes pubOverlayIn{from{opacity:0}to{opacity:1}}
@keyframes pubOverlayOut{from{opacity:1}to{opacity:0}}

.pub-overlay-card{
  background:#fff;border-radius:20px;width:460px;max-width:92vw;max-height:85vh;
  overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.3);
  animation:pubCardIn .4s cubic-bezier(.34,1.56,.64,1)
}
@keyframes pubCardIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* --- 头部 --- */
.pub-oc-header{
  background:linear-gradient(135deg,var(--primary) 0%,#0d2f4a 100%);
  padding:26px 28px;text-align:center;position:relative;overflow:hidden
}
.pub-oc-header::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(191,164,111,.15) 0%,transparent 60%);
  animation:pubHeaderGlow 3s ease-in-out infinite
}
@keyframes pubHeaderGlow{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.2) rotate(180deg)}}

.pub-oc-rocket{
  font-size:42px;display:block;margin-bottom:6px;
  animation:pubRocketShake .5s ease-in-out infinite;position:relative;z-index:1
}
@keyframes pubRocketShake{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-4px) rotate(-4deg)}75%{transform:translateY(3px) rotate(4deg)}}

.pub-oc-title{font-size:17px;font-weight:700;color:#fff;position:relative;z-index:1;letter-spacing:.3px}
.pub-oc-subtitle{font-size:12px;color:rgba(255,255,255,.6);margin-top:3px;position:relative;z-index:1}

/* --- 主体 --- */
.pub-oc-body{padding:22px 28px}
.pub-oc-progress-wrap{margin-bottom:18px}
.pub-oc-progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pub-oc-progress-label{font-size:12px;font-weight:600;color:var(--gray-600)}
.pub-oc-progress-pct{font-size:18px;font-weight:800;color:var(--primary)}

.pub-oc-progress-track{height:10px;background:var(--gray-100);border-radius:10px;overflow:hidden;position:relative}
.pub-oc-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--primary) 0%,var(--accent) 100%);
  border-radius:10px;transition:width .35s ease;position:relative;overflow:hidden
}
.pub-oc-progress-fill::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.4) 50%,transparent 100%);
  animation:pubProgressShine 1.5s linear infinite
}
@keyframes pubProgressShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* --- 平台列表 --- */
.pub-oc-platforms{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
.pub-oc-platforms::-webkit-scrollbar{width:5px}
.pub-oc-platforms::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:5px}

.pub-oc-platform{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:10px;background:var(--gray-50);border:1px solid var(--gray-200);
  transition:all .3s;opacity:.5
}
.pub-oc-platform.publishing{
  background:var(--primary-light);border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(26,58,92,.08);opacity:1
}
.pub-oc-platform.done{
  background:var(--success-light);border-color:var(--success);opacity:1
}

.pub-oc-platform .pub-oc-p-icon{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;flex-shrink:0
}
.pub-oc-platform .pub-oc-p-info{flex:1;min-width:0}
.pub-oc-platform .pub-oc-p-name{font-size:13px;font-weight:600;color:var(--gray-800)}
.pub-oc-platform .pub-oc-p-status{font-size:11px;color:var(--gray-400);margin-top:1px}
.pub-oc-platform.publishing .pub-oc-p-status{color:var(--primary);font-weight:600}
.pub-oc-platform.done .pub-oc-p-status{color:var(--success);font-weight:600}

.pub-oc-platform .pub-oc-p-spinner{
  width:22px;height:22px;border:2.5px solid var(--gray-200);border-top-color:var(--primary);
  border-radius:50%;animation:pubOcSpin .7s linear infinite;flex-shrink:0;display:none
}
.pub-oc-platform.publishing .pub-oc-p-spinner{display:block}
@keyframes pubOcSpin{to{transform:rotate(360deg)}}

.pub-oc-platform .pub-oc-p-check{
  width:22px;height:22px;border-radius:50%;background:var(--success);
  display:none;align-items:center;justify-content:center;flex-shrink:0;
  animation:pubCheckPop .4s cubic-bezier(.34,1.56,.64,1)
}
.pub-oc-platform.done .pub-oc-p-check{display:flex}
.pub-oc-platform.done .pub-oc-p-check::after{
  content:'';width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg);margin-top:-2px
}
@keyframes pubCheckPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* --- 底部完成区 --- */
.pub-oc-footer{
  padding:18px 28px 22px;border-top:1px solid var(--gray-100);
  text-align:center;display:none
}
.pub-oc-footer.show{display:block;animation:pubFooterIn .4s ease}
@keyframes pubFooterIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.pub-oc-footer .pub-oc-done-icon{
  font-size:38px;display:block;margin-bottom:4px;
  animation:pubDoneBounce .5s cubic-bezier(.34,1.56,.64,1)
}
@keyframes pubDoneBounce{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0deg)}}

.pub-oc-footer .pub-oc-done-text{font-size:16px;font-weight:700;color:var(--success)}
.pub-oc-footer .pub-oc-done-sub{font-size:12px;color:var(--gray-500);margin-top:2px}
.pub-oc-footer .pub-oc-close-btn{
  margin-top:14px;padding:9px 32px;background:var(--primary);color:#fff;
  border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .15s;font-family:inherit
}
.pub-oc-footer .pub-oc-close-btn:hover{
  background:var(--primary-hover);transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(26,58,92,.2)
}

/* --- 五彩纸屑 --- */
.pub-confetti-container{
  position:fixed;top:0;left:0;right:0;bottom:0;
  pointer-events:none;overflow:hidden;z-index:10002
}
.pub-confetti-piece{
  position:absolute;width:10px;height:10px;top:-15px;
  animation:pubConfettiFall linear forwards
}
@keyframes pubConfettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0deg)}
  100%{opacity:0;transform:translateY(105vh) rotate(720deg)}
}

/* ===== 平台选择器（简化版） ===== */
.platform-selector{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px
}
.pub-platform-card{
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  padding:14px 12px;text-align:center;cursor:pointer;transition:all .2s;
  position:relative;user-select:none
}
.pub-platform-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.pub-platform-card.selected{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 2px rgba(26,58,92,.08)}
.pub-platform-card .pub-p-icon{font-size:26px;margin-bottom:6px;display:block}
.pub-platform-card .pub-p-name{font-size:12px;font-weight:600;color:var(--gray-800)}
.pub-platform-card .pub-p-check{
  position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;
  border:2px solid var(--gray-300);background:#fff;transition:all .15s
}
.pub-platform-card.selected .pub-p-check{background:var(--success);border-color:var(--success)}
.pub-platform-card.selected .pub-p-check::after{
  content:'';position:absolute;left:4px;top:1px;width:6px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)
}
</style>
</head>
<body>

<div class="demo-page">
  <h1 class="demo-title">🚀 分发成功动画 · 独立预览</h1>
  <p class="demo-subtitle">选择目标平台，点击「一键分发」按钮体验完整的发布效果动画</p>

  <!-- 平台选择器 -->
  <div class="platform-selector" id="platformSelector">
    <!-- 由 JS 动态生成 -->
  </div>

  <!-- 分发按钮 -->
  <div style="width:320px">
    <button class="pub-distribute-btn" id="pubDistributeBtn" onclick="pubDistributeAll()">
      <span class="btn-rocket">🚀</span> 一键分发 ✅
    </button>
    <div class="pub-distribute-success" id="pubDistributeSuccess">
      <span class="su-icon">✅</span>
      <span class="su-text">分发成功！</span>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="pub-toast" id="pubToast"></div>

<script>
// ========== 平台元数据 ==========
var pubPlatformMeta = {
  instagram: { name: 'Instagram', bg: 'linear-gradient(135deg,#E1306C,#C13584)', icon: '📷', handle: '@techpro_brasil' },
  facebook:  { name: 'Facebook',  bg: '#1877F2', icon: '👤', handle: 'TechPro Brasil' },
  tiktok:    { name: 'TikTok',    bg: '#000', icon: '🎵', handle: '@techpro.br' },
  youtube:   { name: 'YouTube',   bg: '#FF0000', icon: '▶️', handle: 'TechPro Brasil' },
  linkedin:  { name: 'LinkedIn',  bg: '#0A66C2', icon: '💼', handle: 'TechPro Brasil' },
  twitter:   { name: 'Twitter / X', bg: '#1DA1F2', icon: '🐦', handle: '@TechProBR' },
  pinterest: { name: 'Pinterest', bg: '#E60023', icon: '📌', handle: 'TechPro Brasil' },
  whatsapp:  { name: 'WhatsApp',  bg: '#25D366', icon: '💬', handle: 'Canal TechPro' }
};

var pubSelectedPlatforms = [];

// ========== 初始化平台选择器 ==========
function initPlatformSelector() {
  var container = document.getElementById('platformSelector');
  var html = '';
  for (var key in pubPlatformMeta) {
    var m = pubPlatformMeta[key];
    html += '<div class="pub-platform-card" data-platform="' + key + '" onclick="togglePlatform(this)">' +
      '<span class="pub-p-icon">' + m.icon + '</span>' +
      '<span class="pub-p-name">' + m.name + '</span>' +
      '<span class="pub-p-check"></span>' +
      '</div>';
  }
  container.innerHTML = html;
}

function togglePlatform(card) {
  card.classList.toggle('selected');
  var plat = card.dataset.platform;
  if (card.classList.contains('selected')) {
    if (pubSelectedPlatforms.indexOf(plat) === -1) pubSelectedPlatforms.push(plat);
  } else {
    var idx = pubSelectedPlatforms.indexOf(plat);
    if (idx !== -1) pubSelectedPlatforms.splice(idx, 1);
  }
}

// ========== Toast ==========
function pubShowToast(msg) {
  var toast = document.getElementById('pubToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

// ========== 分发主函数 ==========
function pubDistributeAll() {
  if (pubSelectedPlatforms.length === 0) {
    pubShowToast('请至少选择一个平台');
    return;
  }

  var platNames = {
    instagram: 'Instagram', facebook: 'Facebook', tiktok: 'TikTok',
    youtube: 'YouTube', linkedin: 'LinkedIn', twitter: 'Twitter/X',
    pinterest: 'Pinterest', whatsapp: 'WhatsApp'
  };
  var names = pubSelectedPlatforms.map(function(p) { return platNames[p] || p; }).join(', ');

  var btn = document.getElementById('pubDistributeBtn');
  if (btn) { btn.style.opacity = '.5'; btn.style.pointerEvents = 'none'; btn.textContent = '分发中...'; }

  pubShowPublishEffect(pubSelectedPlatforms.slice(), function() {
    var successEl = document.getElementById('pubDistributeSuccess');
    if (successEl) {
      successEl.querySelector('.su-text').textContent = '已分发到: ' + names;
      successEl.classList.add('show');
    }
    if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = ''; btn.innerHTML = '<span class="btn-rocket">🚀</span> 一键分发 ✅'; }
    pubShowToast('✅ 内容分发成功！');

    setTimeout(function() {
      if (successEl) successEl.classList.remove('show');
      // 清除选择
      document.querySelectorAll('.pub-platform-card.selected').forEach(function(c) { c.classList.remove('selected'); });
      pubSelectedPlatforms = [];
    }, 4000);
  });
}

// ========== 发布效果动画核心 ==========
function pubShowPublishEffect(platforms, onComplete) {
  var existing = document.getElementById('pubOverlay');
  if (existing) existing.remove();

  var total = platforms.length;
  var meta = platforms.map(function(p) {
    return pubPlatformMeta[p] || { name: p, bg: '#666', icon: '?', handle: '' };
  });

  // 构建 overlay HTML
  var overlay = document.createElement('div');
  overlay.className = 'pub-overlay';
  overlay.id = 'pubOverlay';

  var platformsHTML = meta.map(function(m, i) {
    return '<div class="pub-oc-platform" data-idx="' + i + '">' +
      '<div class="pub-oc-p-icon" style="background:' + m.bg + '">' + m.icon + '</div>' +
      '<div class="pub-oc-p-info"><div class="pub-oc-p-name">' + m.name + '</div>' +
      '<div class="pub-oc-p-status">等待中...</div></div>' +
      '<div class="pub-oc-p-spinner"></div>' +
      '<div class="pub-oc-p-check"></div>' +
      '</div>';
  }).join('');

  overlay.innerHTML =
    '<div class="pub-overlay-card">' +
      '<div class="pub-oc-header">' +
        '<span class="pub-oc-rocket">🚀</span>' +
        '<div class="pub-oc-title" id="pubOcTitle">正在发布内容...</div>' +
        '<div class="pub-oc-subtitle" id="pubOcSubtitle">分发到 ' + total + ' 个平台</div>' +
      '</div>' +
      '<div class="pub-oc-body">' +
        '<div class="pub-oc-progress-wrap">' +
          '<div class="pub-oc-progress-info">' +
            '<span class="pub-oc-progress-label">发布进度</span>' +
            '<span class="pub-oc-progress-pct" id="pubOcPct">0%</span>' +
          '</div>' +
          '<div class="pub-oc-progress-track"><div class="pub-oc-progress-fill" id="pubOcFill"></div></div>' +
        '</div>' +
        '<div class="pub-oc-platforms" id="pubOcPlatforms">' + platformsHTML + '</div>' +
      '</div>' +
      '<div class="pub-oc-footer" id="pubOcFooter">' +
        '<span class="pub-oc-done-icon">✅</span>' +
        '<div class="pub-oc-done-text">发布完成！</div>' +
        '<div class="pub-oc-done-sub" id="pubOcDoneSub">内容已成功分发到 ' + total + ' 个平台</div>' +
        '<button class="pub-oc-close-btn" onclick="pubCloseOverlay()">完成</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(overlay);
  void overlay.offsetWidth;
  overlay.classList.add('show');

  var fillEl = document.getElementById('pubOcFill');
  var pctEl = document.getElementById('pubOcPct');
  var titleEl = document.getElementById('pubOcTitle');
  var subtitleEl = document.getElementById('pubOcSubtitle');

  var statusMessages = [
    '正在连接 {name}...',
    '正在发送内容到 {name}...',
    '正在处理 {name} 的媒体...',
    '正在验证 {name} 的帖子...',
    '正在发布到 {name}...'
  ];

  var currentIdx = 0;

  function publishNext() {
    if (currentIdx >= total) {
      // 全部完成
      fillEl.style.width = '100%';
      pctEl.textContent = '100%';
      titleEl.textContent = '完成！';
      subtitleEl.textContent = '所有平台已更新';

      // 发射五彩纸屑
      pubLaunchConfetti();

      // 短暂延迟后显示底部完成区
      setTimeout(function() {
        var footer = document.getElementById('pubOcFooter');
        if (footer) footer.classList.add('show');
        var rocket = overlay.querySelector('.pub-oc-rocket');
        if (rocket) {
          rocket.style.animation = 'pubDoneBounce .5s cubic-bezier(.34,1.56,.64,1)';
          rocket.textContent = '✅';
        }
      }, 400);

      if (onComplete) onComplete();
      return;
    }

    var platformEl = overlay.querySelector('.pub-oc-platform[data-idx="' + currentIdx + '"]');
    var m = meta[currentIdx];

    // 设置发布中状态
    platformEl.classList.add('publishing');
    platformEl.querySelector('.pub-oc-p-status').textContent = '正在连接 ' + m.name + '...';

    // 更新进度条
    var startPct = Math.round((currentIdx / total) * 100);
    var endPct = Math.round(((currentIdx + 1) / total) * 100);

    // 分步骤动画
    var step = 0;
    var steps = 5;
    var stepInterval = setInterval(function() {
      step++;
      var pct = startPct + Math.round((endPct - startPct) * (step / steps));
      fillEl.style.width = pct + '%';
      pctEl.textContent = pct + '%';

      // 更新状态消息
      var msgIdx = Math.min(step - 1, statusMessages.length - 1);
      platformEl.querySelector('.pub-oc-p-status').textContent = statusMessages[msgIdx].replace(/\{name\}/g, m.name);

      if (step >= steps) {
        clearInterval(stepInterval);
        // 标记为完成
        platformEl.classList.remove('publishing');
        platformEl.classList.add('done');
        platformEl.querySelector('.pub-oc-p-status').textContent = '发布成功';

        currentIdx++;
        setTimeout(publishNext, 250);
      }
    }, 300);
  }

  // 短暂延迟后开始
  setTimeout(publishNext, 600);
}

// ========== 关闭遮罩 ==========
function pubCloseOverlay() {
  var overlay = document.getElementById('pubOverlay');
  if (overlay) {
    overlay.style.animation = 'pubOverlayOut .3s ease forwards';
    setTimeout(function() { if (overlay.parentNode) overlay.remove(); }, 300);
  }
}

// ========== 五彩纸屑效果 ==========
function pubLaunchConfetti() {
  var container = document.createElement('div');
  container.className = 'pub-confetti-container';
  document.body.appendChild(container);

  var colors = ['#bfa46f', '#1a3a5c', '#2d9d78', '#d4943a', '#7c5bba', '#d4504e', '#0a8db3', '#E1306C', '#1877F2', '#25D366'];
  var pieces = 80;

  for (var i = 0; i < pieces; i++) {
    var piece = document.createElement('div');
    piece.className = 'pub-confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (1.8 + Math.random() * 2.5) + 's';
    piece.style.animationDelay = (Math.random() * 0.6) + 's';
    container.appendChild(piece);
  }

  // 动画结束后移除
  setTimeout(function() {
    if (container.parentNode) container.remove();
  }, 5000);
}

// ========== 启动 ==========
initPlatformSelector();
</script>
